[package]
name = "blank"
version = "0.1.9"
edition = "2024"

[dependencies]
actix-web = "4.11"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chimney = { git = "https://github.com/aosasona/chimney", rev = "c01fd6f922850443bf3a13c1b934c7430bc94ca2" }
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
hex = "0.4"
jsonwebtoken = "9.3"
hickory-resolver = "0.26"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.47", features = ["process", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
